<div class="table-responsive" *ngIf="cartService.cart() as cart">
    <table class="table">
        <thead class="text-uppercase" [class.bg-light]="isCart">
            <tr>
                <th><div class="py-2">Product</div></th>
                <th><div class="py-2 text-center">Price</div></th>
                <th><div class="py-2 text-center">Quantity</div></th>
                <th><div class="py-2 text-center">Total</div></th>
                <th *ngIf="isCart" class="align-middle text-center"><div class="py-2">Remove</div></th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of cart.items">
                <th>
                    <div class="p-2 d-inline-block">
                        <img src="{{ item.imageUrl }}" 
                            alt="picture of {{ item.productName }}" 
                            class="img-fluid"
                            style="max-height: 50px"
                        >
                        <div class="mx-3 d-inline-block align-middle">
                            <h5 class="mb-0">
                                <a routerLink="/shop/{{ item.productId }}" class="text-decoration-none text-dark">
                                    {{ item.productName }}
                                </a>
                            </h5>
                            <span class="text-muted fw-normal fst-italic d-block">
                                Category: {{ item.category }}
                            </span>
                        </div>
                    </div>
                </th>
                <td class="align-middle text-center"><strong>{{ item.price | currency }}</strong></td>
                <td class="align-middle">
                    <div class="d-flex align-items-center justify-content-center">
                        <i *ngIf="isCart" class="fa fa-minus-circle text-warning m-2"
                            style="cursor: pointer; font-size: 2em;"
                            (click)="removeCartItem(item.productId)"
                        ></i>
                        <strong style="font-size: 1.2em;">{{ item.quantity }}</strong>
                        <i *ngIf="isCart" class="fa fa-plus-circle text-info mx-2"
                            style="cursor: pointer; font-size: 2em;"
                            (click)="addCartItem(item)"
                        ></i>
                    </div>
                </td>
                <td class="align-middle text-center"><strong>{{ item.price * item.quantity | currency }}</strong></td>
                <td class="align-middle text-center" *ngIf="isCart">
                    <a class="text-danger">
                        <i class="fa fa-trash "
                            style="cursor: pointer; font-size: 2em;"
                            (click)="removeCartItem(item.productId, item.quantity)"
                        ></i>
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
