<div class="flex items-center justify-center min-h-96 bg-gray-100">
  <div class="text-center">

    <mat-icon class="text-red-600 icon-display">error_outline</mat-icon>

    <h1 class="text-4xl font-bold text-gray-800 mt-4">500</h1>

    <p class="text-lg text-gray-600 mt-2">
      Something went wrong.
    </p>

    @if (message) {
    <p class="text-sm text-gray-500 mt-2">
      {{ message }}
    </p>
    }

    <div class="mt-6 flex justify-center gap-4">

      <button mat-flat-button color="primary" (click)="retry()">
        Retry
      </button>

      <button mat-stroked-button color="primary" routerLink="/shop">
        Back to shop
      </button>

    </div>
  </div>
</div>
