<mat-form-field appearance="outline" class="w-full mb-4">
    <mat-label>{{ label }}</mat-label>
  
    <input
      matInput
      [matDatepicker]="picker"
      [formControl]="control"
      [max]="maxDate"
      (blur)="onTouched()"
      [placeholder]="label"
      class="text-sm px-4 py-2 text-gray-800 placeholder-gray-400 rounded"
    />
  
    <mat-datepicker-toggle matSuffix [for]="picker"
      class="text-gray-500 hover:text-blue-500"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  
    <mat-error *ngIf="control.hasError('required')" class="text-red-500 text-sm mt-1">
      {{ label }} is required
    </mat-error>
</mat-form-field>
