<div class="flex gap-4 items-center mb-6">
    <mat-form-field appearance="outline" class="mt-2">
        <mat-label>Filter by status</mat-label>
        <mat-select (selectionChange)="onStatusFilterSelect($event)">
            @for (status of statusFilterOptions; track $index) {
            <mat-option [value]="status">{{ status }}</mat-option>
            }
        </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="mt-2">
        <mat-label>Filter by event type</mat-label>
        <mat-select (selectionChange)="onEventTypeFilterSelect($event)">
            @for (type of eventTypeFilterOptions; track type) {
            <mat-option [value]="type">
                {{ type === 'All' ? 'All' : eventTypeLabels[type] }}
            </mat-option>
            }
        </mat-select>
    </mat-form-field>
</div>

@if (reservations.length === 0) {
<div class="text-center mt-16">
    <p class="text-gray-500 text-lg">No reservations found.</p>
</div>
} @else {
<app-custom-table [columns]="columns" [dataSource]="reservations" [actions]="actions" [totalItems]="totalItems"
    [pageSize]="reservationParams.pageSize" (pageChange)="onPageChange($event)" />
}
