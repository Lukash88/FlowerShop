<h2 mat-dialog-title>Edit Reservation #{{ reservation.id }}</h2>

<mat-dialog-content class="p-3">
  <form [formGroup]="form" class="flex flex-col gap-4 p-4">

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Status</mat-label>
      <mat-select formControlName="reservationStatus">
        @for (s of statusOptions; track s) {
          <mat-option [value]="s">{{ s }}</mat-option>
        }
      </mat-select>
      <mat-error>Status is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Service Price</mat-label>
      <span matPrefix>$&nbsp;</span>
      <input matInput type="number" formControlName="servicePrice" min="0" step="0.01" />
      <mat-error>Enter a valid price</mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button (click)="onSubmit()" [disabled]="form.invalid">Save</button>
</mat-dialog-actions>
