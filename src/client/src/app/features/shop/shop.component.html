@if (products) {
    <div class="container mt-5">
        <div class="row">            
            <section class="col-9">
                <div class="d-flex justify-content-between align-items-center pb-2">
                    <mat-paginator 
                    class="bg-white"
                    (page)="handlePageEvent($event)"
                    [length]="products.rowCount"
                    [pageSize]="products.pageSize"
                    [showFirstLastButtons]="true"
                    [pageSizeOptions]="pageSizeOptions"
                    [pageIndex]="shopParams.pageNumber - 1"
                    aria-label="Select page"
                    >
                </mat-paginator>
                
                <div class="flex gap-3">
                    <button 
                        class="match-input-height"
                        mat-stroked-button
                        (click)="openFiltersDialog()"
                    >
                        <mat-icon>filter_list</mat-icon>
                        Filters
                    </button>
                    <button
                    class="match-input-height"
                    mat-stroked-button
                    [mat-menu-trigger-for]="sortMenu"
                >
                    <mat-icon>swap_vert</mat-icon>
                    Sort
                </button>
                </div>      

                <div class="d-flex flex-row align-items-center flex-wrap mt-2" *ngIf="products">
                    <form
                        #searchForm="ngForm"
                        (ngSubmit)="onSearchChange()"
                        class="relative flex items-center w-full max-w-md mx-4"
                    >
                        <input 
                            type="search"
                            class="block w-full p-4 text-sm text-gray-900 border border-gray-300 rounded-lg"
                            placeholder="Search"
                            name="search"
                            [(ngModel)]="shopParams.search"
                        />
                        <button 
                            mat-icon-button type="submit" 
                            class="absolute inset-y-0 right-8 top-2 flex items-center pl-3"
                        >
                            <mat-icon>search</mat-icon>
                        </button>
                    </form>
                        <button (click)="onReset()" class="btn btn-outline-success my-2">Reset</button>
                    </div>
                </div>

                <div class="grid grid-cols-5 gap-4 py-4">
                    @for (product of products.results; track product.id) {
                    <app-product-item [product]="product"></app-product-item>
                    }
                </div>
            </section>
        </div>
    </div>

    <mat-menu #sortMenu="matMenu">
        <mat-selection-list [multiple]="false" (selectionChange)="onSortChange($event)">
            @for (sort of sortOptions; track $index) {
            <mat-list-option [value]="sort.value" [selected]="shopParams.sort === sort.value">
                {{ sort.name }}
            </mat-list-option>
            }
        </mat-selection-list>
    </mat-menu>
}
