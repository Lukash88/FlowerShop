@if (product) {
    <div class="container mt-5">
        <div class="row">
            <div class="col-6">
                <img src="{{ product.imageUrl }}" alt="picture of product: {{ product.name }}" class="img-fluid w-100">
            </div>
            <div class="col-6">
                <h3>{{ product.name }}</h3>
                <p style="font-size: 2em;">{{ product.price | currency }}</p>
    
                <h5 class="text-primary mb-3" *ngIf="quantityInCart > 0">
                    You have {{ quantityInCart }} of this item in your cart
                </h5>
    
                <div class="d-flex justify-content-start align-items-center">
                    <button [disabled]="quantity === quantityInCart" 
                            (click)="updateCart()"
                            mat-flat-button class="match-input-height">
                            <mat-icon>shopping_cart</mat-icon>
                            {{ buttonText }}
                        </button>

                        <mat-form-field appearance="outline" class="flex">
                            <mat-label>Quantity</mat-label>
                            <input matInput min="0" [(ngModel)]="quantity" type="number">
                        </mat-form-field>
                </div>
            </div>
            <div class="row mt-5">
                <div class="col-12 ms-3">
                    <h4>Description</h4>
                    <p>{{ product.longDescription }}</p>
                </div>
            </div>
        </div>    
    </div>
}
